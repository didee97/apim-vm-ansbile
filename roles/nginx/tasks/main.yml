---
# The package starts nginx right after installing it, with its default site,
# which listens on [::]:80. On a VM with IPv6 turned off that start fails and
# dpkg leaves nginx half-installed. So block service starts during the install
# (policy-rc.d), remove the default site, and start nginx ourselves below.
- name: Check for an existing policy-rc.d
  ansible.builtin.stat:
    path: /usr/sbin/policy-rc.d
  register: nginx_policy_rc

- name: Install nginx without starting it
  block:
    - name: Block service starts during the nginx install
      ansible.builtin.copy:
        dest: /usr/sbin/policy-rc.d
        mode: "0755"
        content: |
          #!/bin/sh
          # Temporary, added by Ansible (roles/nginx) during the nginx install.
          exit 101
      when: not nginx_policy_rc.stat.exists

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
  always:
    - name: Allow service starts again
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: not nginx_policy_rc.stat.exists

- name: Create SSL directory
  ansible.builtin.file:
    path: "{{ ssl_dir }}"
    state: directory
    mode: "0750"

- name: Copy SSL certificate and key ({{ ssl_mode }})
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ ssl_dir }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ ssl_cert_src }}", dest: apim.crt, mode: "0644" }
    - { src: "{{ ssl_key_src }}", dest: apim.key, mode: "0600" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Reload nginx

- name: Deploy load balancer upstreams
  ansible.builtin.template:
    src: loadbalancer.conf.j2
    dest: /etc/nginx/conf.d/loadbalancer.conf
    mode: "0644"
  notify: Reload nginx

- name: Deploy APIM server blocks
  ansible.builtin.template:
    src: apim.conf.j2
    dest: /etc/nginx/sites-available/apim.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable APIM site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/apim.conf
    dest: /etc/nginx/sites-enabled/apim.conf
    state: link
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Start nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
