---
###########################################
# MYSQL SETUP
############################################
- name: MySQL Setup
  hosts: mysql
  become: true
  vars_files:
    - vars.yml

  tasks:

    - name: Install MySQL and dependency
      apt:
        name:
          - mysql-server
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Ensure MySQL service is running
      systemd:
        name: mysql
        state: started
        enabled: yes

    - name: Wait for MySQL socket
      wait_for:
        path: /run/mysqld/mysqld.sock
        timeout: 60

    - name: Ensure SQL directory exists
      file:
        path: "{{ sql_dir }}"
        state: directory
        mode: '0755'

    - name: Download mysql_apim.sql
      get_url:
        url: "{{ mysql_apim_sql_url }}"
        dest: "{{ sql_dir }}/mysql_apim.sql"

    - name: Download mysql_shared.sql
      get_url:
        url: "{{ mysql_shared_sql_url }}"
        dest: "{{ sql_dir }}/mysql_shared.sql"

    # Create databases first (IMPORTANT)
    - name: Create APIM database
      mysql_db:
        name: "{{ apim_db }}"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Create Shared database
      mysql_db:
        name: "{{ apim_shared_db }}"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Import mysql_apim.sql
      mysql_db:
        name: "{{ apim_db }}"
        state: import
        target: "{{ sql_dir }}/mysql_apim.sql"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Import mysql_shared.sql
      mysql_db:
        name: "{{ apim_shared_db }}"
        state: import
        target: "{{ sql_dir }}/mysql_shared.sql"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Grant privileges on multiple databases
      community.mysql.mysql_user:
        name: "{{ apim_db_user }}"
        password: "{{ apim_db_password }}"
        host: "%"
        # Combine both DBs into one string separated by a slash
        priv: "{{ apim_db }}.*:ALL/{{ apim_shared_db }}.*:ALL"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Set bind-address to allow remote connections
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'

    - name: Restart MySQL
      service:
        name: mysql
        state: restarted
############################################
# NGINX LOAD BALANCER SETUP
############################################
- name: Nginx Setup
  hosts: nginx
  become: true
  vars_files:
    - vars.yml

  tasks:

    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Create SSL directory
      file:
        path: "{{ ssl_dir }}"
        state: directory

    - name: Generate self signed certificate
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout {{ ssl_dir }}/apim.key
        -out {{ ssl_dir }}/apim.crt
        -subj "/CN=*.{{ domain_name }}"
      args:
        creates: "{{ ssl_dir }}/apim.crt"

    - name: Fetch SSL certificate to Ansible controller
      fetch:
        src: "{{ ssl_dir }}/apim.crt"
        dest: "/tmp/apim.crt"
        flat: yes

    - name: Deploy load balancer upstreams
      template:
        src: nginx-conf/loadbalancer.conf.j2
        dest: /etc/nginx/conf.d/loadbalancer.conf

    - name: Deploy AMWso2 server blocks
      template:
        src: nginx-conf/amwso2.conf.j2
        dest: /etc/nginx/sites-available/amwso2.conf

    - name: Enable AMWso2 site
      file:
        src: /etc/nginx/sites-available/amwso2.conf
        dest: /etc/nginx/sites-enabled/amwso2.conf
        state: link
        force: yes

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: Add Nginx IP and domain to /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: ".*am-uat.{{ domain_name }}.*"
        line: "{{ groups['nginx'][0] }} am-uat.{{ domain_name }} api-uat.{{ domain_name }}"
        state: present

###########################################
# WSO2 APIM SETUP
###########################################
- name: Install and Configure WSO2 APIM
  hosts: apim
  become: true
  vars_files:
    - vars.yml

  tasks:

    - name: Install required packages
      apt:
        name:
          - unzip
          - openjdk-11-jdk
        state: present
        update_cache: yes

    - name: Download WSO2 APIM zip
      get_url:
        url: "{{ apim_zip_url }}"
        dest: "/home/{{ ansible_user }}/wso2am-4.6.0.zip"

    - name: Unzip WSO2 APIM
      unarchive:
        src: "/home/{{ ansible_user }}/wso2am-4.6.0.zip"
        dest: "/home/{{ ansible_user }}/"
        remote_src: yes
        creates: "{{ apim_home }}"

    - name: Change ownership
      file:
        path: "{{ apim_home }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes

    - name: Download MySQL driver
      get_url:
        url: https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.2.0/mysql-connector-j-9.2.0.jar
        dest: "{{ apim_home }}/repository/components/lib/mysql-connector-j.jar"

    - name: Copy deployment.toml for Node 1
      template:
        src: templates/deployment/cp1-deployment.toml.j2
        dest: "{{ apim_home }}/repository/conf/deployment.toml"
      when: inventory_hostname == groups['apim'][0]

    - name: Copy deployment.toml for Node 2
      template:
        src: templates/deployment/cp2-deployment.toml.j2
        dest: "{{ apim_home }}/repository/conf/deployment.toml"
      when: inventory_hostname == groups['apim'][1]

    - name: Copy certificate from Controller to APIM node
      copy:
        src: "/tmp/apim.crt"   
        dest: "{{ apim_home }}/repository/resources/security/amwso2com.crt"  
        mode: '0644'

    - name: Import certificate into WSO2 truststore
      community.general.java_cert:
        cert_path: "{{ apim_home }}/repository/resources/security/amwso2com.crt"
        keystore_path: "{{ apim_home }}/repository/resources/security/client-truststore.jks"
        keystore_pass: wso2carbon
        cert_alias: amwso2com
        state: present

    - name: Create systemd service file
      template:
        src: wso2-apim.service.j2
        dest: /etc/systemd/system/wso2-apim.service
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable APIM service
      systemd:
        name: wso2-apim
        enabled: yes

    - name: Start APIM on first node
      systemd:
        name: wso2-apim
        state: started
      when: inventory_hostname == groups['apim'][0]
    
    - name: Start APIM on second node
      systemd:
        name: wso2-apim
        state: started
      when: inventory_hostname == groups['apim'][1]

    - name: Add Nginx IP and domain to /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: ".*am-uat.{{ domain_name }}.*"
        line: "{{ groups['nginx'][0] }} am-uat.{{ domain_name }} api-uat.{{ domain_name }}"
        state: present
