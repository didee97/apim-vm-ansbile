---
############################################
# SAVE DEPLOYMENT SETTINGS
#
# Don't run this directly: ./configure.sh asks the questions step by step
# (scripts/configure.py) and passes the answers here. This playbook checks
# them again and writes:
#   inventory/hosts.ini             - the 4 VMs
#   group_vars/all/10-config.yml    - DB type, domains, SSL choice ...
#   group_vars/all/20-secrets.yml   - passwords (mode 0600, git-ignored)
#   .deploy.env                     - whether deploy.sh asks SSH / sudo passwords
############################################
- name: Save WSO2 APIM deployment settings
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ip_regex: '^(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}$'
    domain_regex: '^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$'

  tasks:
    - name: Check the answers were passed in
      ansible.builtin.assert:
        quiet: true
        that: answers is defined and answer_secrets is defined
        fail_msg: "Run ./configure.sh to answer the questions (it calls this playbook)."

    - name: Collect answers
      ansible.builtin.set_fact:
        cfg: "{{ answers | combine({'ssh_key': answers.ssh_key | default('', true)}) }}"
        secrets: "{{ answer_secrets }}"
        cfg_mssql_pid: "{{ answers.mssql_pid | default('Developer') }}"
        cfg_mssql_eula: "{{ answers.mssql_accept_eula | default(false) | bool }}"
      no_log: true

    - name: Validate answers
      ansible.builtin.assert:
        quiet: true
        that:
          - cfg.db_type in ['postgres', 'mysql', 'mssql']
          - cfg.apim_distribution | default('opensource') in ['opensource', 'licensed']
          - cfg.apim_distribution | default('opensource') == 'opensource' or (cfg.apim_zip_src | default('') is file)
          - cfg.db_ip is match(ip_regex)
          - cfg.lb_ip is match(ip_regex)
          - cfg.node1_ip is match(ip_regex)
          - cfg.node2_ip is match(ip_regex)
          - cfg.gateway_ip is match(ip_regex)
          - cfg.node1_ip != cfg.node2_ip
          - cfg.cp_domain is match(domain_regex)
          - cfg.gw_domain is match(domain_regex)
          - cfg.cp_domain != cfg.gw_domain
          - cfg.ssl_mode in ['selfsigned', 'existing']
          - cfg.ssl_mode == 'selfsigned' or (cfg.ssl_cert_src is file and cfg.ssl_key_src is file)
          - cfg.db_type != 'mssql' or cfg_mssql_eula
          - cfg.db_type != 'mssql' or (secrets.mssql_sa_password | length >= 8)
          - cfg.apim_env is match('^[a-z0-9][a-z0-9_-]*$')
          - not cfg.fluent_bit_install or (cfg.opensearch_host is match(ip_regex) or cfg.opensearch_host is match(domain_regex))
          - not cfg.fluent_bit_install or (cfg.opensearch_port | string is match('^[0-9]{1,5}$'))
          - not cfg.fluent_bit_install or (secrets.opensearch_password | length > 0)
        fail_msg: >-
          Invalid answer. Check: db type is postgres/mysql/mssql, all IPs are IPv4, node IPs differ,
          domains are FQDNs and differ, certificate/key files exist on this machine,
          for SQL Server the EULA is accepted and the SA password has 8+ chars,
          the environment is lower-case letters/digits/-/_, and for Fluent Bit the
          OpenSearch host is an IP or FQDN, the port is a number and a password is set.
          Got: {{ cfg | to_nice_json }}

    ########## Write files ##########
    - name: Write inventory
      ansible.builtin.template:
        src: templates/configure/hosts.ini.j2
        dest: "{{ playbook_dir }}/inventory/hosts.ini"
        mode: "0644"

    - name: Write configuration
      ansible.builtin.template:
        src: templates/configure/config.yml.j2
        dest: "{{ playbook_dir }}/group_vars/all/10-config.yml"
        mode: "0644"

    - name: Write secrets
      ansible.builtin.template:
        src: templates/configure/secrets.yml.j2
        dest: "{{ playbook_dir }}/group_vars/all/20-secrets.yml"
        mode: "0600"
      no_log: true

    - name: Write deploy.sh options
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/.deploy.env"
        mode: "0644"
        content: |
          # Generated by configure.yml
          export ANSIBLE_ASK_PASS={{ cfg.ssh_key == '' }}
          export ANSIBLE_BECOME_ASK_PASS={{ cfg.sudo_ask == 'y' }}

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "APIM package  : {{ 'licensed: ' ~ cfg.apim_zip_src if cfg.apim_distribution | default('opensource') == 'licensed' else 'open source (GitHub)' }}"
          - "Database      : {{ cfg.db_type }} on {{ cfg.db_ip }}"
          - "Load balancer : nginx on {{ cfg.lb_ip }}"
          - "APIM nodes    : {{ cfg.node1_ip }}, {{ cfg.node2_ip }} (throttling sync between them)"
          - "Control plane : https://{{ cfg.cp_domain }}/publisher  /devportal  /admin  /carbon"
          - "Gateway       : https://{{ cfg.gw_domain }}  -> {{ cfg.gateway_ip }}"
          - "SSL           : {{ cfg.ssl_mode }}{{ ' (' ~ cfg.ssl_cert_src ~ ')' if cfg.ssl_mode == 'existing' else '' }}"
          - "Environment   : {{ cfg.apim_env }}"
          - >-
            Fluent Bit    : {{ ('yes -> https://' ~ cfg.opensearch_host ~ ':' ~ cfg.opensearch_port ~ ' as ' ~ cfg.opensearch_user ~ ', env=' ~ cfg.apim_env)
                               if cfg.fluent_bit_install else 'no' }}
          - "Passwords are in group_vars/all/20-secrets.yml (consider: ansible-vault encrypt group_vars/all/20-secrets.yml)"
